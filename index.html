<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bongo Can Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        /* Верхняя панель */
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
        }

        /* Основная зона клика (банка и стейты) */
        .click-area {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: flex-end; /* Выравнивание по нижнему краю */
            justify-content: center;
            width: 100%;
            margin: 20px 0;
        }

        /* Банка и состояния выровнены по низу */
        .can-wrapper {
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .can-wrapper:active {
            transform: scale(0.96);
        }

        .can-img {
            max-height: 350px;
            width: auto;
            object-fit: contain;
        }

        /* Стейты и банка поверх друг друга по нижнему краю */
        .state-img {
            position: absolute;
            bottom: 0;
            max-height: 350px;
            width: auto;
            display: none;
            pointer-events: none;
        }

        .state-img.active {
            display: block;
        }

        /* Иконки эмоций у нижнего края банки (снизу) */
        .emotions-bar {
            position: absolute;
            bottom: 10px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .emotion-icon {
            width: 40px;
            height: 40px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            padding: 5px;
        }

        /* Нижняя панель управления */
        .footer-menu {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
            margin-bottom: 10px;
        }

        .menu-btn {
            background: #ffcc00;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            color: #000;
        }

        /* Модальное окно библиотеки */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: #444;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1; /* Сохраняет пропорции крестика строго квадратными */
            flex-shrink: 0;
        }

        /* Сетка скинов: ровно 3 колонки максимум, прокрутка вниз */
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            max-height: calc(4 * 90px + 3 * 10px); /* Ограничение в 4 строки видимости */
            padding-right: 5px;
        }

        .skin-cell {
            background: #3a3a3a;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .skin-cell img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Шапка с очками -->
        <div class="header">
            <span>Банки: <span id="score">0</span></span>
            <span>Клик/сек: <span id="cps">0</span></span>
        </div>

        <!-- Центральная интерактивная зона -->
        <div class="click-area" id="click-target">
            <div class="can-wrapper">
                <!-- Базовое изображение банки -->
                <img src="can.png" alt="Can" class="can-img" id="main-can">
                <!-- Состояния анимации/клика -->
                <img src="state1.png" alt="State 1" class="state-img" id="state1">
                <img src="state2.png" alt="State 2" class="state-img" id="state2">
                
                <!-- Иконки эмоций у нижнего края банки -->
                <div class="emotions-bar">
                    <img src="emotion1.png" alt="Emotion" class="emotion-icon">
                    <img src="emotion2.png" alt="Emotion" class="emotion-icon">
                </div>
            </div>
        </div>

        <!-- Нижнее меню -->
        <div class="footer-menu">
            <button class="menu-btn" id="open-lib">Библиотека</button>
        </div>
    </div>

    <!-- Окно библиотеки -->
    <div class="modal" id="lib-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Коллекция</h3>
                <button class="close-btn" id="close-lib">×</button>
            </div>
            <!-- Динамическая сетка: нет пустых ячеек, ячейки добавляются по мере открытия скинов -->
            <div class="skins-grid" id="skins-grid">
                <!-- Сюда динамически добавляются ячейки -->
            </div>
        </div>
    </div>

    <script>
        // Актуальная ссылка на проект: https://foxylove3d.github.io/banka_v_popi/
        let score = 0;
        const scoreElement = document.getElementById('score');
        const clickTarget = document.getElementById('click-target');
        const state1 = document.getElementById('state1');
        const state2 = document.getElementById('state2');
        
        const openLibBtn = document.getElementById('open-lib');
        const closeLibBtn = document.getElementById('close-lib');
        const libModal = document.getElementById('lib-modal');
        const skinsGrid = document.getElementById('skins-grid');

        // Список разблокированных скинов (изначально только дефолтные элементы)
        let unlockedSkins = ['can.png', 'state1.png', 'state2.png']; 

        // Отрисовка библиотеки без пустых ячеек
        function renderLibrary() {
            skinsGrid.innerHTML = '';
            unlockedSkins.forEach(skin => {
                const cell = document.createElement('div');
                cell.className = 'skin-cell';
                const img = document.createElement('img');
                img.src = skin;
                cell.appendChild(img);
                skinsGrid.appendChild(cell);
            });
        }

        // Клик по банке
        clickTarget.addEventListener('click', () => {
            score += 1;
            scoreElement.textContent = score;

            // Смена стейтов при клике
            state1.classList.add('active');
            setTimeout(() => {
                state1.classList.remove('active');
                state2.classList.add('active');
                setTimeout(() => {
                    state2.classList.remove('active');
                }, 100);
            }, 100);
        });

        // Открытие/закрытие модального окна
        openLibBtn.addEventListener('click', () => {
            renderLibrary();
            libModal.classList.add('open');
        });

        closeLibBtn.addEventListener('click', () => {
            libModal.classList.remove('open');
        });
    </script>
</body>
</html>
