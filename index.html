<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bongo Can Clicker</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #7b2cbf;
            color: #ffffff;
            font-family: sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px 10px;
        }

        /* Верхняя панель: счетчик и сундук рядом */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            margin-top: 10px;
        }

        .score-box {
            background: #e2d1f9;
            color: #1a1a1a;
            padding: 10px 30px;
            border-radius: 30px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1);
        }

        /* Сундук рядом со счетчиком */
        .chest-icon {
            width: 50px;
            height: 50px;
            object-fit: contain;
            cursor: pointer;
            display: none;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        /* Центральная зона с уменьшенной банкой */
        .click-area {
            position: relative;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .can-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.05s ease;
        }

        .can-wrapper:active {
            transform: scale(0.96);
        }

        .can-img {
            max-height: 220px;
            width: auto;
            object-fit: contain;
        }

        .state-img {
            position: absolute;
            max-height: 220px;
            width: auto;
            display: none;
            pointer-events: none;
        }

        .state-img.active {
            display: block;
        }

        /* Нижнее меню */
        .footer-menu {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .menu-btn {
            background: #a3c4f3;
            border: none;
            width: 60px;
            height: 60px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1);
        }

        .menu-btn img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .color-btn { background: #ffb5a7; }
        .backpack-btn { background: #b5e48c; }
        .style-btn { background: #ffc8dd; }
        .home-btn { background: #fde2e4; }

        /* Модальное окно библиотеки */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: #444;
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            flex-shrink: 0;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            max-height: calc(4 * 90px + 3 * 10px);
            padding-right: 5px;
        }

        .skin-cell {
            background: #3a3a3a;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid transparent;
        }

        .skin-cell img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Верхняя панель: Счётчик и сундук рядом -->
        <div class="top-bar">
            <div class="score-box" id="score">70</div>
            <img src="chest.png" alt="Chest" class="chest-icon" id="chest">
        </div>

        <!-- Центральная интерактивная зона (уменьшенная банка) -->
        <div class="click-area" id="click-target">
            <div class="can-wrapper">
                <img src="can.png" alt="Can" class="can-img" id="main-can">
                <img src="state1.png" alt="State 1" class="state-img" id="state1">
                <img src="state2.png" alt="State 2" class="state-img" id="state2">
            </div>
        </div>

        <!-- Нижнее меню -->
        <div class="footer-menu">
            <button class="menu-btn color-btn" id="color-btn" title="Цвет фона">
                <img src="icon_color_background.png" alt="Color" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' width=\'24\' height=\'24\' viewBox=\'0 0 24 24\' fill=\'none\' stroke=\'currentColor\' stroke-width=\'2\'><circle cx=\'12\' cy=\'12\' r=\'10\'/></svg>'">
            </button>
            <button class="menu-btn backpack-btn" id="open-lib">
                <img src="backpack.png" alt="Library">
            </button>
            <button class="menu-btn style-btn">
                <img src="glasses.png" alt="Style">
            </button>
            <button class="menu-btn home-btn">
                <img src="home.png" alt="Home">
            </button>
        </div>
    </div>

    <!-- Окно библиотеки -->
    <div class="modal" id="lib-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Коллекция</h3>
                <button class="close-btn" id="close-lib">×</button>
            </div>
            <div class="skins-grid" id="skins-grid"></div>
        </div>
    </div>

    <script>
        let score = 70;
        const scoreElement = document.getElementById('score');
        const clickTarget = document.getElementById('click-target');
        const state1 = document.getElementById('state1');
        const state2 = document.getElementById('state2');
        
        const openLibBtn = document.getElementById('open-lib');
        const closeLibBtn = document.getElementById('close-lib');
        const libModal = document.getElementById('lib-modal');
        const skinsGrid = document.getElementById('skins-grid');
        const chest = document.getElementById('chest');

        let unlockedSkins = ['can.png', 'state1.png', 'state2.png']; 

        const CHEST_COOLDOWN = 30 * 60 * 1000; // 30 минут

        function checkChestTimer() {
            const lastChestTime = localStorage.getItem('last_chest_time');
            const now = Date.now();

            if (!lastChestTime || (now - parseInt(lastChestTime)) > CHEST_COOLDOWN) {
                chest.style.display = 'block';
            } else {
                chest.style.display = 'none';
            }
        }

        chest.addEventListener('click', (e) => {
            e.stopPropagation();
            score += 50;
            scoreElement.textContent = score;
            
            localStorage.setItem('last_chest_time', Date.now().toString());
            chest.style.display = 'none';
        });

        setInterval(checkChestTimer, 10000);
        checkChestTimer();

        function renderLibrary() {
            skinsGrid.innerHTML = '';
            unlockedSkins.forEach(skin => {
                const cell = document.createElement('div');
                cell.className = 'skin-cell';
                const img = document.createElement('img');
                img.src = skin;
                cell.appendChild(img);
                skinsGrid.appendChild(cell);
            });
        }

        clickTarget.addEventListener('click', () => {
            score += 1;
            scoreElement.textContent = score;

            state1.classList.add('active');
            setTimeout(() => {
                state1.classList.remove('active');
                state2.classList.add('active');
                setTimeout(() => {
                    state2.classList.remove('active');
                }, 100);
            }, 100);
        });

        openLibBtn.addEventListener('click', () => {
            renderLibrary();
            libModal.classList.add('open');
        });

        closeLibBtn.addEventListener('click', () => {
            libModal.classList.remove('open');
        });
    </script>
</body>
</html>
