<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bongo Can Clicker</title>
    <style>
        @font-face {
            font-family: 'Johann';
            src: url('Johann-Light.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #7b2cbf;
            color: #ffffff;
            font-family: 'Johann', sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            height: 100dvh;
        }

        .game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            overflow: hidden;
        }

        /* Слои банки и персонажа (накладываются пиксель в пиксель) */
        .can-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 2;
        }

        .face-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            z-index: 3;
        }

        .state-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
            z-index: 5; /* Поверх банки и лица во время анимации */
        }

        .state-img.active {
            display: block;
        }

        /* Невидимая кликабельная зона по центру */
        .click-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 10;
        }

        .click-area:active ~ .can-img {
            transform: scale(0.98);
            transition: transform 0.05s ease;
        }

        /* Верхняя панель со счетчиком */
        .score-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
        }

        .score-box {
            position: absolute;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 55px;
            background-image: url('icon_clicks.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #1a1a1a;
            pointer-events: auto;
            padding-top: 2px;
        }

        /* Сундук в правом верхнем углу */
        .chest-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            width: 65px;
            height: 65px;
            object-fit: contain;
            cursor: pointer;
            display: none;
            z-index: 25;
            pointer-events: auto;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        /* Нижнее меню */
        .footer-menu {
            position: absolute;
            bottom: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 30;
            pointer-events: none;
        }

        .menu-btn {
            background: transparent;
            border: none;
            width: 55px;
            height: 55px;
            cursor: pointer;
            padding: 0;
            pointer-events: auto;
        }

        .menu-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Модальное окно библиотеки скинов */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            width: 100%;
            max-width: 400px;
            max-height: 80vh;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-btn {
            background: transparent;
            border: none;
            padding: 0;
            width: 32px;
            height: 32px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .skins-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            overflow-y: auto;
            max-height: calc(4 * 90px + 3 * 10px);
            padding-right: 5px;
        }

        .skin-cell {
            background-image: url('skin_slot.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            cursor: pointer;
        }

        .skin-cell img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Слои персонажа (используем точные файлы из вашего репозитория) -->
        <img src="state1_legs.png" alt="State 1" class="state-img" id="state1">
        <img src="state2_legs.png" alt="State 2" class="state-img" id="state2">
        <img src="emotion_default_trall.png" alt="Face" class="face-img">
        <img src="банка.png" alt="Can" class="can-img" id="main-can">

        <!-- Кликабельная зона -->
        <div class="click-area" id="click-target"></div>

        <!-- Верхняя панель -->
        <div class="score-container">
            <div class="score-box" id="score">70</div>
            <img src="icon_chest.png" alt="Chest" class="chest-icon" id="chest">
        </div>

        <!-- Нижнее меню управления -->
        <div class="footer-menu">
            <button class="menu-btn" id="color-btn" title="Цвет фона">
                <img src="icon_color_background.png" alt="Color">
            </button>
            <button class="menu-btn" id="open-lib" title="Библиотека">
                <img src="icon_clothes.png" alt="Library">
            </button>
            <button class="menu-btn" title="Стиль">
                <img src="icon_emotions.png" alt="Style">
            </button>
            <button class="menu-btn" title="Главная">
                <img src="icon_home.png" alt="Home">
            </button>
        </div>
    </div>

    <!-- Окно библиотеки скинов (заполняется из ваших файлов репозитория) -->
    <div class="modal" id="lib-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Коллекция</h3>
                <button class="close-btn" id="close-lib">
                    <img src="icon_button_close.png" alt="Close">
                </button>
            </div>
            <div class="skins-grid" id="skins-grid"></div>
        </div>
    </div>

    <script>
        let score = 70;
        const scoreElement = document.getElementById('score');
        const clickTarget = document.getElementById('click-target');
        const state1 = document.getElementById('state1');
        const state2 = document.getElementById('state2');
        const mainCan = document.getElementById('main-can');
        
        const openLibBtn = document.getElementById('open-lib');
        const closeLibBtn = document.getElementById('close-lib');
        const libModal = document.getElementById('lib-modal');
        const skinsGrid = document.getElementById('skins-grid');
        const chest = document.getElementById('chest');

        // Список всех доступных скинов из вашего репозитория
        let unlockedSkins = [
            'skin_default_borsh.png', 
            'skin_default_cucumber.png', 
            'skin_default_fish.png', 
            'skin_default_pony.png', 
            'skin_rare_crotovuha.png'
        ]; 

        const CHEST_COOLDOWN = 30 * 60 * 1000; // 30 минут

        function checkChestTimer() {
            const lastChestTime = localStorage.getItem('last_chest_time');
            const now = Date.now();

            if (!lastChestTime || (now - parseInt(lastChestTime)) > CHEST_COOLDOWN) {
                chest.style.display = 'block';
            } else {
                chest.style.display = 'none';
            }
        }

        chest.addEventListener('click', (e) => {
            e.stopPropagation();
            score += 50;
            scoreElement.textContent = score;
            localStorage.setItem('last_chest_time', Date.now().toString());
            chest.style.display = 'none';
        });

        setInterval(checkChestTimer, 10000);
        checkChestTimer();

        function renderLibrary() {
            skinsGrid.innerHTML = '';
            unlockedSkins.forEach(skin => {
                const cell = document.createElement('div');
                cell.className = 'skin-cell';
                const img = document.createElement('img');
                img.src = skin;
                cell.appendChild(img);

                // При клике на скин в библиотеке меняем банку
                cell.addEventListener('click', () => {
                    mainCan.src = skin;
                    libModal.classList.remove('open');
                });

                skinsGrid.appendChild(cell);
            });
        }

        clickTarget.addEventListener('click', () => {
            score += 1;
            scoreElement.textContent = score;

            state1.classList.add('active');
            setTimeout(() => {
                state1.classList.remove('active');
                state2.classList.add('active');
                setTimeout(() => {
                    state2.classList.remove('active');
                }, 100);
            }, 100);
        });

        openLibBtn.addEventListener('click', () => {
            renderLibrary();
            libModal.classList.add('open');
        });

        closeLibBtn.addEventListener('click', () => {
            libModal.classList.remove('open');
        });
    </script>
</body>
</html>
